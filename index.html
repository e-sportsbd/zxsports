<script>
const DB="https://zx-sports-656da-default-rtdb.firebaseio.com/";
const P={users:"Shuvo_Users69x ",ff:"Shuvo_FreeFire69x ",sl:"Shuvo_Sliders69x ",notice:"Shuvo_Notice69x ",admin:"Shuvo_Admin69x "};
const $=s=>document.querySelector(s);
const api=async(p,m="GET",b,q="")=>{const r=await fetch(DB+p.split("/").map(encodeURIComponent).join("/")+".json"+q,{method:m,body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error("Network/Rules error "+r.status);return r.json()};
const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)};
let me=JSON.parse(localStorage.zx_me||"null"),tab="home",view=null,SLTMR=null;
const MODES=[["Br Match","br_match","Battle Royale"],["Cs Match","cs_match","Clash Squad"],["Lw Match","lw_match","Lone Wolf"],["Ludo Match","ludo_match","Ludo"],["Verses Match","verses_match","Verses"],["Free Match","free_match","Free Match"]];
const tk=v=>"৳"+(+v||0);
function shell(inner){
 $("#app").innerHTML=`<header><img src="assets/app_logo.jpg"><b>ZX SPORTS</b><span class="bal">${tk(me.Balance)}</span></header><main>${inner}</main>
 <nav>${[["home","🏠","Home"],["my","🎮","My Matches"],["rank","🏆","Leaderboard"],["wallet","💰","Wallet"],["me","👤","Profile"]].map(t=>`<a class="${tab==t[0]?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</a>`).join("")}</nav>`}
function go(t){tab=t;view=null;render()}
async function refreshMe(){if(!me)return;const u=await api(P.users+"/"+me._k);if(u){me={...u,_k:me._k};localStorage.zx_me=JSON.stringify(me)}}
function auth(mode="login"){
 $("#app").innerHTML=`<main><img class="lg" src="assets/app_logo.jpg"><h3 class="c">${mode=="login"?"Login":"Create Account"}</h3>
 ${mode=="reg"?'<input id="n" placeholder="Full Name">':""}<input id="u" placeholder="Username"><input id="pw" type="password" placeholder="Password">
 <button onclick="${mode=="login"?"login()":"register()"}" style="margin-top:8px">${mode=="login"?"Login":"Register"}</button>
 <p class="c mu" style="margin-top:16px;cursor:pointer" onclick="auth('${mode=="login"?"reg":"login"}')">${mode=="login"?"অ্যাকাউন্ট নেই? Register":"আগেই অ্যাকাউন্ট আছে? Login"}</p></main>`}
async function findUser(u){const all=await api(P.users)||{};const k=Object.keys(all).find(k=>(all[k].Username||"").toLowerCase()==u.toLowerCase());return k?{...all[k],_k:k}:null}
async function login(){try{const u=$("#u").value.trim(),pw=$("#pw").value,x=await findUser(u);
 if(!x||String(x.Password)!==pw)return toast("Username বা Password ভুল");
 if(x.UsersBan)return toast("আপনার অ্যাকাউন্ট ব্যান করা হয়েছে");me=x;localStorage.zx_me=JSON.stringify(me);render()}catch(e){toast(e.message)}}
async function register(){try{const n=$("#n").value.trim(),u=$("#u").value.trim(),pw=$("#pw").value;
 if(!n||u.length<3||pw.length<6)return toast("সব তথ্য ঠিকভাবে দিন (Password কমপক্ষে ৬)");
 if(await findUser(u))return toast("এই Username আগে থেকেই আছে");
 const d={Name:n,Username:u,Password:pw,Balance:0,Winning:0,"Total Played":0,"Used Code":""};
 const r=await api(P.users,"POST",d);me={...d,_k:r.name};localStorage.zx_me=JSON.stringify(me);render()}catch(e){toast(e.message)}}
function logout(){localStorage.removeItem("zx_me");me=null;render()}

async function home(){
 if(view){return matches(view)}
 shell(`<div class="sl" id="sl"><div>Loading…</div></div><h3>Play Matches</h3><div class="grid">${MODES.map(m=>`<div class="mode" onclick="view='${m[0]}';render()"><img src="assets/${m[1]}.jpg"><p>${m[2]}</p></div>`).join("")}</div>`);
 try{const s=await api(P.sl),n=await api(P.notice);const t=[...Object.values(s||{}).map(x=>x.Title||x.Text||x.Notice||""),...Object.values(n||{}).map(x=>typeof x=="string"?x:(x.Notice||x.Title||""))].filter(Boolean);
 $("#sl").innerHTML=(t.length?t:["Welcome to ZX SPORTS 🎮"]).map(x=>`<div>${x}</div>`).join("")}catch(e){$("#sl").innerHTML="<div>Welcome to ZX SPORTS 🎮</div>"}}
async function matches(type){
 shell(`<div class="row" style="margin-bottom:12px"><button class="back" onclick="view=null;render()">←</button><h3 style="margin:0">${type}</h3><span></span></div><div id="ml" class="mu c">Loading…</div>`);
